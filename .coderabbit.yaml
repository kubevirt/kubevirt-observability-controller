# CodeRabbit Configuration
# Full reference: https://docs.coderabbit.ai/reference/configuration

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
language: en-US
tone_instructions: "Act as senior engineer: professional, constructive feedback only. Serious about metric and label backward compatibility, PromQL correctness, and runbook coverage for every alert. Flag issues with file/line references. End positively."
early_access: false
enable_free_tier: true

# ---------------------------------------------------------------------------
# Reviews > General
# ---------------------------------------------------------------------------
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: ""
  review_status: false
  review_details: false
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!**/vendor/**"
    - "!go.sum"
    # Generated files — review only the generators, not their output.
    - "!docs/metrics.md" # generated by hack/gen-metrics-docs
    - "!config/rbac/**" # generated by controller-gen from code
  path_instructions:
    - path: "pkg/monitoring/rules/**"
      instructions: |
        Alerting and recording rules:
        - Every alert must set runbook_url to a runbook published in kubevirt/monitoring;
          `make test-e2e` only checks that the annotation is present, so verify
          manually that the URL resolves.
        - PromQL expressions must be valid and covered by the promtool fixtures
          (hack/promtool-tests.sh runs against the generated rules).
        - Rules may only reference metrics available in the deployment. For
          controller-owned metrics, the source of truth is the collectors in
          pkg/monitoring/metrics/ (docs/metrics.md is generated from them);
          external metrics the deployment provides, such as kube-state-metrics
          (kube_pod_info, kube_pod_status_phase), are also allowed.
        - Renaming or relabeling a metric used by rules is a breaking change for
          downstream dashboards and alerts — flag it explicitly.
    - path: "pkg/monitoring/rules/alerts/vms.go"
      instructions: |
        VM-scoped alerts:
        - Every alert that fires per virtual machine must expose a `vm` typed
          resource label so the alert can link to the VM resource page. Derive
          it from the `name` label, or from a different source label (for
          example `vmi`), via label_replace.
        - Keep the label_replace pattern uniform across alerts; when available,
          prefer the withVMLabel()/withVMLabelFrom() helpers in vms.go over
          hand-rolled variants.
        - Exempt alerts (not per-VM): VirtLauncherPodsStuckFailed,
          OrphanedVirtualMachineInstances, OutdatedVirtualMachineInstanceWorkloads.
        - Keep expressions in sync with kubevirt's
          pkg/monitoring/rules/alerts/vms.go; when porting or copying an alert,
          copy its current expression including dedup (topk) and namespace
          filters, and port the matching promtool fixture cases.
    - path: "pkg/monitoring/metrics/**"
      instructions: |
        Metrics collectors:
        - Metric names use the kubevirt_ prefix and follow the KubeVirt monitoring
          guidelines (kubevirt/monitoring).
        - Avoid unbounded label cardinality: no per-object values such as VM names,
          UUIDs, or namespace+name pairs as labels.
        - New metrics must be reflected in docs/metrics.md (regenerate with
          `go run ./hack/gen-metrics-docs`) and pass the metric-name linter
          (hack/prom-metric-linter).
        - VMStats collection is filtered by the metrics allowlist; verify that new
          metrics are added to it when they require additional VMStats commands.
    - path: "pkg/controller/**"
      instructions: |
        Controller reconcile logic:
        - Reconcile must be idempotent; requeue logic should have a clear reason.
        - Watched resources need correct owner references and RBAC (config/rbac).
        - Status updates and resource creation must tolerate pre-existing objects
          not owned by this controller.
    - path: "**/*_test.go"
      instructions: |
        Unit tests:
        - Prefer table-driven tests for multiple similar cases.
        - Ginkgo/Gomega dot-imports are expected in suites; do not flag them.
        - Each test case should cover one clear behaviour; avoid global mutable state.
    - path: "test/monitoring/**"
      instructions: |
        End-to-end monitoring tests (run with kubevirtci, see
        docs/running-e2e-tests.md):
        - Tests must clean up created resources and tolerate re-runs.
        - Alert tests should assert on the exact alert name and runbook_url.
    - path: "docs/**"
      instructions: |
        Documentation. Note docs/metrics.md is generated — do not hand-edit it;
        change the metric descriptions in code and regenerate.
    - path: "hack/**"
      instructions: |
        Shell and Go helper scripts. Follow shellcheck; scripts must use
        `set -euo pipefail` and quote variable expansions.
    - path: "config/**"
      instructions: |
        Kustomize deployment manifests. config/rbac is generated by
        controller-gen — RBAC changes belong in kubebuilder markers in the
        Go code, not in the YAML.
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: false

  # ---------------------------------------------------------------------------
  # Reviews > Auto Review
  # ---------------------------------------------------------------------------
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    ignore_title_keywords:
      - "WIP"
    labels:
      - "!do-not-merge/work-in-progress"
    drafts: false
    ignore_usernames:
      - "kubevirt-bot"
      - "renovate[bot]"
      - "dependabot[bot]"

  # ---------------------------------------------------------------------------
  # Reviews > Finishing Touches
  # ---------------------------------------------------------------------------
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  # ---------------------------------------------------------------------------
  # Reviews > Pre-merge Checks
  # ---------------------------------------------------------------------------
  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  # ---------------------------------------------------------------------------
  # Review Tools: all enabled by default (golangci-lint, hadolint, yamllint, shellcheck, markdownlint, gitleaks, etc.)
  # ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Chat
# ---------------------------------------------------------------------------
chat:
  art: true
  allow_non_org_members: true
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

# ---------------------------------------------------------------------------
# Knowledge Base
# ---------------------------------------------------------------------------
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
  learnings:
    scope: global
  issues:
    scope: global
  jira:
    usage: disabled
  linear:
    usage: disabled
  pull_requests:
    scope: global
  mcp:
    usage: disabled
  # Linked repositories — the controller externalizes monitoring from these repos.
  linked_repositories:
    - repository: "kubevirt/kubevirt"
      instructions: "Core virtualization platform. The controller reads the vmstats API and VMI status from KubeVirt; metric names and labels must stay compatible with the ones KubeVirt exposes. Use to verify vmstats fields, VMI status semantics, and existing metric definitions."
    - repository: "kubevirt/monitoring"
      instructions: "Alert runbooks and monitoring guidelines. Every alert's runbook_url must point to a published runbook here. Use to check whether a runbook exists before an alert is added."
    - repository: "kubevirt/hyperconverged-cluster-operator"
      instructions: "Deploys the controller as part of OpenShift Virtualization (CNV). Use to verify how the controller is deployed and configured there: command-line flags, RBAC, and deployment manifests."
    - repository: "kubevirt/kubevirtci"
      instructions: "Cluster definitions and tooling for the ephemeral clusters used by the e2e tests."
    - repository: "kubevirt/community"
      instructions: "Community governance, design proposals, and org-wide conventions."
    - repository: "kubevirt/enhancements"
      instructions: "Enhancement proposals for KubeVirt features. Reference when reviewing implementations of proposed features."
    - repository: "kubevirt/project-infra"
      instructions: "CI/CD infrastructure, Prow job definitions, and test lane configurations."

# ---------------------------------------------------------------------------
# Issue Enrichment
# ---------------------------------------------------------------------------
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
