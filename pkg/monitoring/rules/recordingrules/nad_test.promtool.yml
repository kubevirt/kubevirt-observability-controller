rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: VM interfaces aggregate by NAD configuration
    interval: 1m
    input_series:
      - series: 'kubevirt_network_attachment_definition_info{namespace="app",network="blue",vlan="100",cni_type="bridge",ipam_type="static",ovn_subnets="",udn_role="",ovn_topology="",ovn_persistent_ips="",mac_spoof_filtering="false",bridge_preserving_default_vlan="false",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_network_attachment_definition_info{namespace="other",network="green",vlan="200",cni_type="bridge",ipam_type="static",ovn_subnets="",udn_role="",ovn_topology="",ovn_persistent_ips="",mac_spoof_filtering="false",bridge_preserving_default_vlan="false",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_network_attachment_definition_info{namespace="shared",network="ovn",vlan="",cni_type="ovn-k8s-cni-overlay",ipam_type="",ovn_subnets="10.0.0.0/16",udn_role="primary",ovn_topology="layer2",ovn_persistent_ips="true",mac_spoof_filtering="",bridge_preserving_default_vlan="",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-a",namespace="app",vnic_name="eth0",binding_type="core",network="blue",binding_name="bridge",model="virtio"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-a",namespace="app",vnic_name="eth1",binding_type="core",network="blue",binding_name="bridge",model="virtio"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-b",namespace="other",vnic_name="eth0",binding_type="core",network="green",binding_name="sriov",model="e1000e"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-c",namespace="shared",vnic_name="eth1",binding_type="core",network="ovn",binding_name="bridge",model="virtio"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-c",namespace="shared",vnic_name="default",binding_type="core",network="pod networking",binding_name="masquerade",model="virtio"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-d",namespace="demo",vnic_name="eth1",binding_type="core",network="shared/ovn",binding_name="bridge",model="virtio"}'
        values: '1x5'
    promql_expr_test:
      - expr: cluster:kubevirt_network_attachment_definition_info:sum
        eval_time: 5m
        exp_samples:
          - labels: 'cluster:kubevirt_network_attachment_definition_info:sum{cni_type="bridge",ipam_type="static",ovn_persistent_ips="",ovn_topology="",udn_role=""}'
            value: 3
          - labels: 'cluster:kubevirt_network_attachment_definition_info:sum{cni_type="ovn-k8s-cni-overlay",ipam_type="",ovn_persistent_ips="true",ovn_topology="layer2",udn_role="primary"}'
            value: 2

  - name: each CNI plugin of one NAD counts the same interfaces
    interval: 1m
    input_series:
      - series: 'kubevirt_network_attachment_definition_info{namespace="app",network="blue",vlan="100",cni_type="bridge",ipam_type="",ovn_subnets="",udn_role="",ovn_topology="",ovn_persistent_ips="",mac_spoof_filtering="",bridge_preserving_default_vlan="",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_network_attachment_definition_info{namespace="app",network="blue",vlan="",cni_type="tuning",ipam_type="",ovn_subnets="",udn_role="",ovn_topology="",ovn_persistent_ips="",mac_spoof_filtering="",bridge_preserving_default_vlan="",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-a",namespace="app",vnic_name="eth1",binding_type="core",network="blue",binding_name="bridge",model="virtio"}'
        values: '1x5'
    promql_expr_test:
      - expr: cluster:kubevirt_network_attachment_definition_info:sum
        eval_time: 5m
        exp_samples:
          - labels: 'cluster:kubevirt_network_attachment_definition_info:sum{cni_type="bridge",ipam_type="",ovn_persistent_ips="",ovn_topology="",udn_role=""}'
            value: 1
          - labels: 'cluster:kubevirt_network_attachment_definition_info:sum{cni_type="tuning",ipam_type="",ovn_persistent_ips="",ovn_topology="",udn_role=""}'
            value: 1

  - name: same VM name in different namespaces both count
    interval: 1m
    input_series:
      - series: 'kubevirt_network_attachment_definition_info{namespace="shared",network="ovn",vlan="",cni_type="ovn-k8s-cni-overlay",ipam_type="",ovn_subnets="",udn_role="primary",ovn_topology="layer2",ovn_persistent_ips="true",mac_spoof_filtering="",bridge_preserving_default_vlan="",bridge_disable_container_interface=""}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-a",namespace="tenant-a",vnic_name="eth1",binding_type="core",network="shared/ovn",binding_name="bridge",model="virtio"}'
        values: '1x5'
      - series: 'kubevirt_vm_vnic_info{name="vm-a",namespace="tenant-b",vnic_name="eth1",binding_type="core",network="shared/ovn",binding_name="bridge",model="virtio"}'
        values: '1x5'
    promql_expr_test:
      - expr: cluster:kubevirt_network_attachment_definition_info:sum
        eval_time: 5m
        exp_samples:
          - labels: 'cluster:kubevirt_network_attachment_definition_info:sum{cni_type="ovn-k8s-cni-overlay",ipam_type="",ovn_persistent_ips="true",ovn_topology="layer2",udn_role="primary"}'
            value: 2
