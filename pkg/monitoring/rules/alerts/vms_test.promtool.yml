rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - name: OutdatedGuestDeviceDrivers fires after one hour
    interval: 1m
    input_series:
      - series: 'kubevirt_vmi_guest_device_driver_date_seconds{namespace="default",name="vm-old",device_id="VEN_1AF4&DEV_1041",driver_name="netkvm",driver_version="100.85.104.16700",guest_os_version_id="9"}'
        values: '1700000000x70'
      - series: 'kubevirt_vmi_guest_device_driver_date_seconds{name="vm-no-namespace",device_id="VEN_1AF4&DEV_1041",driver_name="netkvm",driver_version="100.85.104.16700",guest_os_version_id="9"}'
        values: '1700000000x70'
      - series: 'kubevirt_guest_device_driver_latest_version_info{device_id="VEN_1AF4&DEV_1041",driver_version="100.95.104.26200",guest_os_version_id="9"}'
        values: '1x70'
    alert_rule_test:
      - alertname: OutdatedGuestDeviceDrivers
        eval_time: 59m
        exp_alerts: []
      - alertname: OutdatedGuestDeviceDrivers
        eval_time: 61m
        exp_alerts:
          - exp_labels:
              namespace: default
              name: vm-old
              device_id: "VEN_1AF4&DEV_1041"
              driver_name: netkvm
              driver_version: "100.85.104.16700"
              guest_os_version_id: "9"
              severity: warning
              operator_health_impact: none
              kubernetes_operator_part_of: kubevirt
              kubernetes_operator_component: kubevirt
            exp_annotations:
              summary: "A guest device driver is outdated: its installed version is not the latest known version for that device and guest OS version."
              description: "VirtualMachine vm-old in namespace default is running driver netkvm version 100.85.104.16700, which is outdated for guest OS version 9."
              runbook_url: "https://kubevirt.io/monitoring/runbooks/OutdatedGuestDeviceDrivers"
